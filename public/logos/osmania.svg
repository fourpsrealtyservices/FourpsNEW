<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80">
  <rect width="200" height="80" fill="white"/>
  <!-- Osmania University emblem -->
  <circle cx="40" cy="40" r="25" fill="none" stroke="#8B1A1A" stroke-width="2.5"/>
  <circle cx="40" cy="40" r="20" fill="none" stroke="#8B1A1A" stroke-width="1"/>
  <text x="40" y="37" font-family="serif" font-size="9" font-weight="bold" fill="#8B1A1A" text-anchor="middle">OU</text>
  <text x="40" y="49" font-family="serif" font-size="6" fill="#8B1A1A" text-anchor="middle">Est. 1918</text>
  <!-- Full name -->
  <text x="130" y="35" font-family="serif" font-size="11" font-weight="bold" fill="#8B1A1A" text-anchor="middle">Osmania</text>
  <text x="130" y="50" font-family="serif" font-size="11" font-weight="bold" fill="#8B1A1A" text-anchor="middle">University</text>
</svg>
